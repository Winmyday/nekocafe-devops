name: CI
# NekoCafe CI流水线
# 班级：计算机233  姓名：刘俞靖  学号：231002501

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Lint Python (flake8)
        run: |
          pip install flake8
          flake8 services/reservation/src/ --max-line-length=120

      - name: Lint JavaScript (eslint)
        run: |
          cd services/member
          npm ci
          npx eslint src/ --max-warnings=0

      - name: Lint Dockerfiles (hadolint)
        run: |
          docker pull hadolint/hadolint
          docker run --rm -i hadolint/hadolint < services/reservation/Dockerfile
          docker run --rm -i hadolint/hadolint < services/member/Dockerfile

      - name: Lint YAML (yamllint)
        run: |
          pip install yamllint
          yamllint -c .yamllint.yml .github/workflows/ docker-compose.yml

  unit-test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nekocafe, POSTGRES_PASSWORD: nekocafe, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('services/reservation/requirements.txt') }}

      - name: Python Unit Test
        run: |
          cd services/reservation
          pip install -r requirements.txt pytest pytest-cov
          python -m pytest tests/ --cov=src --cov-report=xml --cov-report=term --junitxml=junit.xml
        env:
          DATABASE_URL: postgresql://nekocafe:nekocafe@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('services/member/package-lock.json') }}

      - name: Node.js Unit Test
        run: |
          cd services/member
          npm ci
          npm test

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/*/coverage.xml

  sast:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [unit-test, sast]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build Reservation Image
        uses: docker/build-push-action@v5
        with:
          context: services/reservation
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/reservation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Member Image
        uses: docker/build-push-action@v5
        with:
          context: services/member
          push: true
          no-cache: true
          tags: ghcr.io/${{ env.REPO_LC }}/member:${{ github.sha }}

  container-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Trivy Scan - Reservation
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.REPO_LC }}/reservation:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy Scan - Member
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.REPO_LC }}/member:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --wait

      - name: Run Integration Tests
        run: |
          sleep 10
          curl -s http://localhost:8081/healthz | grep ok
          curl -s http://localhost:8082/healthz | grep ok
          # Test: create reservation
          BODY='{"store_id":"S001","table_id":"T001",'
          BODY="$BODY""\"date\":\"2026-05-08\",\"slot_id\":\"lunch\","
          BODY="$BODY""\"guest_count\":2}"
          curl -s -X POST http://localhost:8081/api/v1/reservations \
            -H "Content-Type: application/json" \
            -d "$BODY" | grep confirmed

      - name: Cleanup
        if: always()
        run: docker compose down -v
